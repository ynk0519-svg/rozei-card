<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>政策カード ワークシート｜租税教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--mizu:#55B8E1;--mizu-d:#1B7FB0;--ao:#12587E;--dai:#F0912F;--aka:#E8352B;
  --hoshi:#F0CE3E;--kami:#EAF6FC;--sumi:#15242E;--sen:#BEDCEB;--kanri:#22384A;--midori:#2E7D4F}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--sumi);background:var(--kami);line-height:1.7;-webkit-text-size-adjust:100%}
body.admin{background:#F2F5F7}
#app{max-width:1080px;margin:0 auto;padding:12px 12px 64px}
h1{font-size:1.4rem;font-weight:900;margin:.2em 0 .1em;color:var(--ao)}
h2{font-size:1.12rem;font-weight:900;margin:.1em 0 .3em;color:var(--ao)}
h3{font-size:.98rem;font-weight:900;margin:14px 0 4px;color:var(--kanri)}
.lead{margin:.2em 0 .9em}.sub{color:#5A7688;font-size:.88rem}.center{text-align:center}
.panel{background:#fff;border:2px solid var(--sen);border-radius:16px;padding:14px;margin-bottom:14px}
.admin h1,.admin h2{color:var(--kanri)}
.admin .panel{border:1px solid #DCE3E8;box-shadow:0 1px 3px rgba(34,56,74,.06)}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.step{display:inline-flex;align-items:center;gap:8px;background:var(--ao);color:#fff;border-radius:999px;
  padding:5px 15px;font-weight:700;font-size:.92rem}
.step b{font-size:1.1rem}
.route{display:flex;gap:5px;margin-bottom:10px}
.route span{flex:1;height:7px;border-radius:99px;background:#CFE7F3}
.route span.on{background:var(--hoshi)}.route span.done{background:var(--mizu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;
  border:none;border-radius:99px;background:var(--ao);color:#fff;font:inherit;font-weight:700;font-size:1.03rem;
  cursor:pointer;box-shadow:0 4px 0 #093C58}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #093C58}
.btn.gold{background:var(--dai);color:#4A2500;box-shadow:0 4px 0 #B96C14}
.btn.gold:active{box-shadow:0 1px 0 #B96C14}
.btn.ghost{background:#fff;color:var(--ao);border:2px solid var(--ao);box-shadow:none;min-height:46px;font-size:.93rem}
.btn.mini{min-height:38px;padding:0 14px;font-size:.88rem;box-shadow:none;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{background:#AFC6D3;color:#EFF6FA;box-shadow:0 4px 0 #91A9B7;cursor:not-allowed}
.admin .btn{background:var(--kanri);box-shadow:0 3px 0 #101E29;border-radius:12px;min-height:48px;font-size:.98rem}
.admin .btn:active{box-shadow:0 1px 0 #101E29}
.admin .btn.ghost{background:#fff;color:var(--kanri);border:1px solid #C6D2DA;box-shadow:none}
.admin .btn.gold{background:var(--dai);color:#fff;box-shadow:0 3px 0 #B96C14}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn-row.center{justify-content:center}
:focus-visible{outline:4px solid var(--aka);outline-offset:3px}
.linkbtn{background:none;border:none;color:#5A7688;font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;padding:8px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;font:inherit;color:var(--sumi);
  border:2px solid var(--sen);border-radius:12px;padding:11px 13px;background:#fff}
.admin input,.admin textarea,.admin select{border:1px solid #C6D2DA;border-radius:10px}
input:focus,textarea:focus,select:focus{border-color:var(--mizu-d);outline:none}
textarea{min-height:100px;resize:vertical;line-height:1.9}
label.field{display:block;margin:11px 0 0;font-weight:700;font-size:.93rem}
label.field span{font-weight:500;color:#5A7688;font-size:.83rem;margin-left:6px}
.two-col{display:grid;gap:10px}@media(min-width:620px){.two-col{grid-template-columns:1fr 1fr}}

/* カード */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:840px){.grid{grid-template-columns:repeat(4,1fr)}}
.cardwrap{position:relative}
.card{position:relative;display:block;width:100%;aspect-ratio:320/418;padding:0;border:0;border-radius:12px;
  overflow:hidden;background:var(--mizu);cursor:pointer;font:inherit;box-shadow:0 2px 6px rgba(18,88,126,.22);
  transition:transform .12s ease}
.card.full{aspect-ratio:320/532}
.card:active{transform:scale(.97)}
.card:disabled{cursor:default}
.card img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.card.picked{outline:5px solid var(--dai);outline-offset:2px}
.badge{position:absolute;top:-8px;right:-8px;min-width:32px;height:32px;padding:0 9px;border-radius:99px;
  background:var(--dai);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.92rem;
  box-shadow:0 2px 5px rgba(0,0,0,.25);pointer-events:none}
.zoom{position:absolute;bottom:5px;right:5px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);
  border:none;color:var(--ao);font-size:1rem;cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.draw{display:flex;flex-direction:column;align-items:center;height:100%;background:var(--mizu);padding:6%;
  text-align:center;color:#fff;position:relative;overflow:hidden}
.draw .no{position:absolute;top:3%;left:5%;font-weight:900;font-size:.8rem;background:#fff;color:var(--ao);
  width:21px;height:21px;border-radius:50%;display:grid;place-items:center}
.draw .disc{width:80%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-size:2.2rem;overflow:hidden;border:3px solid rgba(255,255,255,.55);margin-top:7%}
.draw .disc img{width:100%;height:100%;object-fit:cover}
.draw .ribbon{margin-top:-11%;width:106%;background:var(--dai);color:var(--aka);border-top:2px solid #fff9;
  border-bottom:2px solid #0002;padding:4px;font-weight:900;font-size:.76rem;line-height:1.2;
  text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff}
.draw .st{color:var(--hoshi);font-size:.9rem;letter-spacing:1px;text-shadow:0 1px 1px #0003}
.cardcap{font-size:.74rem;font-weight:700;color:var(--ao);text-align:center;margin-top:3px;line-height:1.3}
.meter{position:sticky;top:4px;z-index:5;background:var(--ao);color:#fff;border-radius:14px;padding:11px 13px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;box-shadow:0 4px 12px rgba(18,88,126,.28)}
.meter .slots{display:flex;gap:4px;font-size:1.7rem;line-height:1}
.meter .slot{color:#3E7695}.meter .slot.on{color:var(--hoshi)}
.meter .txt{font-weight:700}.meter .yen{margin-left:auto;font-size:.88rem;color:#CDE9F6}
.meter.over{background:var(--aka)}.meter.over .slot{color:#F8CFCB}
.reveal{display:grid;gap:10px}@media(min-width:680px){.reveal{grid-template-columns:1fr 1fr}}
.who{background:#fff;border:2px solid var(--sen);border-radius:14px;padding:10px;display:flex;gap:10px}
.who .mini{width:76px;flex:0 0 76px}
.who .name{font-weight:900;color:var(--ao)}
.who .why{font-size:.9rem;white-space:pre-wrap;margin-top:2px}
.who .why:empty::after{content:"（理由はこれから話そう）";color:#8DA5B4}
.flip{animation:fl .5s ease both}
@keyframes fl{from{transform:rotateY(90deg) scale(.92);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.flip{animation:none}}
.modal{position:fixed;inset:0;background:rgba(10,45,65,.74);display:grid;place-items:center;padding:14px;z-index:50;overflow:auto}
.modal .box{background:#fff;border-radius:18px;max-width:760px;width:100%;padding:16px}
.modal .two{display:grid;gap:14px}@media(min-width:620px){.modal .two{grid-template-columns:210px 1fr}}
.ask{background:var(--kami);border:2px dashed var(--mizu);border-radius:14px;padding:11px 13px;margin-top:9px}
.ask p{margin:0 0 9px}.ask p:last-child{margin:0}
.kouka{display:inline-block;background:var(--dai);color:#fff;border-radius:6px;padding:0 8px;font-weight:900;font-size:.84rem;margin-right:6px}
.stage{background:var(--ao);color:#fff;border-radius:20px;padding:18px 14px;text-align:center}
.stage h2{color:#fff;font-size:1.4rem}
.stage .nums{font-size:2.4rem;font-weight:900;color:var(--hoshi);line-height:1.25}
.stage .why{background:#fff;color:var(--sumi);border-radius:14px;padding:14px;text-align:left;white-space:pre-wrap;font-size:1.02rem;margin-top:12px}
.talk{background:#fff;border:2px dashed var(--mizu);border-radius:14px;padding:11px 13px;margin-top:11px;text-align:left;font-size:.93rem}
.talk b{color:var(--ao)}
.total{background:rgba(255,255,255,.15);border-radius:12px;padding:7px 12px;margin-top:9px;font-weight:700}
.sheet{background:#fff;border:3px solid var(--ao);border-radius:16px;padding:16px;margin-bottom:12px}
.sheet .ttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--hoshi);padding-bottom:8px;margin-bottom:10px}
.sheet .ttl b{font-size:1.4rem;color:var(--ao)}
.sheet .sec{margin-top:12px}
.sheet .sec>.lb{display:inline-block;background:var(--ao);color:#fff;border-radius:6px;padding:1px 10px;font-weight:900;font-size:.85rem;margin-bottom:5px}
.sheet .policy{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.sheet .policy .one{width:92px}
.sheet .reason{background:var(--kami);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.sheet table{width:100%;border-collapse:collapse;font-size:.9rem}
.sheet td,.sheet th{border-bottom:1px solid var(--sen);padding:5px 4px;text-align:left;vertical-align:top}
.sheet th{font-size:.8rem;color:#5A7688}
.sheet .foot{margin-top:10px;font-size:.8rem;color:#5A7688;text-align:right}
.turnbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.chip{background:#fff;border:2px solid var(--sen);border-radius:99px;padding:2px 11px;font-size:.84rem;font-weight:700}
.chip.now{background:var(--hoshi);border-color:var(--hoshi)}
.chip.done{background:var(--mizu);border-color:var(--mizu);color:#fff}
.member-row{display:flex;gap:8px;align-items:center;margin-top:7px}
.member-row .num{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--ao);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:.85rem}
.icon-btn{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:2px solid var(--sen);background:#fff;
  color:var(--ao);font-size:1.05rem;font-weight:900;cursor:pointer}
.admin .icon-btn{border:1px solid #C6D2DA;color:var(--kanri);border-radius:10px}
.rules{margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:9px;padding:6px 0;border-bottom:1px dashed var(--sen)}
.rules li:last-child{border:none}
.rules .n{flex:0 0 auto;background:var(--dai);color:#fff;border-radius:8px;padding:1px 9px;font-weight:900;height:fit-content}
.big-emoji{font-size:3rem;line-height:1}
.hint{background:#FFF4E2;border:2px solid var(--dai);border-radius:12px;padding:10px 13px;font-size:.9rem}
.note{background:#fff;border-left:4px solid var(--dai);border-radius:8px;padding:10px 13px;font-size:.9rem;margin-top:10px}
/* 役割えらび */
.roles{display:grid;gap:12px;margin-top:16px}
@media(min-width:720px){.roles{grid-template-columns:repeat(3,1fr)}}
.role{background:#fff;border:2px solid var(--sen);border-radius:16px;padding:18px 16px;text-align:center;cursor:pointer;font:inherit}
.role:hover{border-color:var(--ao)}
.role .ic{font-size:2.2rem}
.role b{display:block;font-size:1.1rem;color:var(--ao);margin-top:4px}
.role span{font-size:.85rem;color:#5A7688}
/* コンソール */
.abar{background:var(--kanri);color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;z-index:20}
.abar.teach{background:var(--ao)}
.abar .ttl{font-weight:900;font-size:1rem}
.abar .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.abar button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:9px 15px;font:inherit;
  font-size:.9rem;font-weight:700;cursor:pointer}
.abar button.on{background:var(--dai)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid #DCE3E8;border-radius:12px;padding:11px 13px}
.stat b{display:block;font-size:1.7rem;color:var(--kanri);line-height:1.15}
.stat span{font-size:.8rem;color:#5A7688}
.grouprow{background:#fff;border:1px solid #DCE3E8;border-left:5px solid var(--mizu);border-radius:12px;
  padding:11px 13px;margin-bottom:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer}
.grouprow:hover{border-color:var(--kanri);border-left-color:var(--kanri)}
.grouprow.fin{border-left-color:var(--midori)}
.grouprow .gname{font-weight:900;font-size:1.02rem;color:var(--kanri);min-width:92px}
.state{border-radius:99px;padding:2px 11px;font-size:.8rem;font-weight:700;background:#E8EEF2;color:#44607A;white-space:nowrap}
.state.s1{background:#FFF0D8;color:#9A5F07}
.state.s2{background:#DCF0FA;color:#14607F}
.state.s3{background:#E3F5E5;color:#26703A}
.state.s4{background:#2E7D4F;color:#fff}
.pill{background:var(--mizu);color:#fff;border-radius:7px;padding:1px 8px;font-weight:900;font-size:.84rem;display:inline-block}
.pill.gray{background:#C3D1DA}.pill.dai{background:var(--dai)}
.chart{background:#fff;border:1px solid #DCE3E8;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.chart h2{display:flex;align-items:center;gap:8px;font-size:1.02rem;margin:0 0 2px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:0 0 14px}
.ch-row{display:grid;grid-template-columns:190px 1fr 86px;align-items:center;gap:10px;margin-bottom:7px}
@media(max-width:640px){.ch-row{grid-template-columns:1fr 72px;gap:4px 8px}.ch-row .ch-lab{grid-column:1/3;margin-top:4px}}
.ch-lab{font-size:.86rem;font-weight:700;color:var(--kanri);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-track{position:relative;display:block;height:22px;border-radius:4px;background-color:#F1F5F8;
  background-image:repeating-linear-gradient(90deg,#D3E0E8 0 1px,transparent 1px var(--tick));box-shadow:inset -1px 0 0 #D3E0E8}
.ch-fill{display:block;height:100%;border-radius:0 4px 4px 0}
.ch-val{font-weight:900;font-size:.82rem;text-align:right;color:var(--kanri);white-space:nowrap}
.ch-val i{font-style:normal;font-weight:500;color:#5A7688}
.ch-axisrow{display:grid;grid-template-columns:190px 1fr 86px;gap:10px;margin-top:-2px}
@media(max-width:640px){.ch-axisrow{grid-template-columns:1fr 72px}.ch-axisrow>span:first-child{display:none}}
.ch-axis{position:relative;height:16px}
.ch-axis span{position:absolute;top:0;transform:translateX(-50%);font-size:.72rem;color:#5A7688}
.ch-axis span:last-child{transform:translateX(-100%)}
.ch-axis span:first-child{transform:none}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{border-bottom:1px solid #E3E9ED;padding:7px 5px;text-align:left;vertical-align:top}
.tbl th{color:#5A7688;font-size:.8rem}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:#F4F8FA}
.edit-row{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #DCE3E8;border-radius:12px;padding:9px;margin-bottom:8px}
.edit-row .thumb{width:50px;flex:0 0 50px}
.edit-row .info{flex:1;min-width:0}
.edit-row .info b{display:block;color:var(--kanri)}
.edit-row .tools{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.edit-row .tools .icon-btn{width:40px;height:40px;flex:0 0 40px;font-size:1rem}
.star-pick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.star-pick button{min-width:50px;height:46px;border-radius:10px;border:1px solid #C6D2DA;background:#fff;
  color:#D9A81E;font:inherit;font-size:1rem;font-weight:900;cursor:pointer}
.star-pick button.on{background:var(--kanri);border-color:var(--kanri)}
.preview{width:140px;margin:0 auto 6px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:200px}
.badge-code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#EEF3F6;border:1px solid #D7E1E8;
  border-radius:8px;padding:2px 10px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--kanri);color:#fff;
  padding:12px 20px;border-radius:99px;font-weight:700;z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.25)}
@media print{.btn,.btn-row,.route,.meter,.abar,.linkbtn,.zoom{display:none!important}
  body{background:#fff}.sheet{border-color:#000}.panel{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   政策カード ワークシート（鹿児島法人会青年部会 租税教室）
   運営（青年部会）／学校（先生）／生徒 の3階層

const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- データ ---------- */
let CARDS=clone(DEFAULT_CARDS);
let CFG={maxStars:5,orgPass:"0000",
  endpoint:"https://script.google.com/macros/s/AKfycbw8j6YgG59x-wijacvy0HJ57olhSSegnF2ZrR4txDAi8ku7MfTy2FwJCyf2snB4ZD80/exec",   // 結果の送信先（Googleスプレッドシート）
  readKey:""};       // 運営だけが持つ取りこみ用キー
let SCHOOLS=[];        // {code,name,pass,note}
let GROUPS=[];         // 結果（班ごと）
let DEV={school:"",schoolName:"",className:""};    // この端末の設定（先生が設定）
const STEPS=5;

const card=id=>CARDS.find(c=>c.id===id)||{id:id,title:"？",stars:0,yen:0};
const nextId=()=>CARDS.reduce((a,c)=>Math.max(a,c.id),0)+1;
const stars=n=>"★".repeat(n);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yen=n=>(n||0).toLocaleString("ja-JP")+"円";
const man=n=>Math.round((n||0)/10000).toLocaleString("ja-JP")+"万円";
const sumStars=ids=>ids.reduce((a,id)=>a+card(id).stars,0);
const sumYen=ids=>ids.reduce((a,id)=>a+(card(id).yen||0),0);
const schoolName=code=>{const s=SCHOOLS.find(x=>x.code===code);return s?s.name:(code||"");};

const LS={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}};
function packCards(){return CARDS.map(c=>{const d=DEFAULT_CARDS.find(x=>x.id===c.id&&x.title===c.title);
  const o=Object.assign({},c); if(d&&o.img===d.img) o.img="#def"; return o;});}
function unpackCards(l){return l.map(c=>{const o=Object.assign({},c);
  if(o.img==="#def"){const d=DEFAULT_CARDS.find(x=>x.id===o.id); o.img=d?d.img:"";} return o;});}
function saveSetup(){LS.set("rozei-setup",{cards:packCards(),cfg:CFG,schools:SCHOOLS});}
function saveGroups(){ if(!LS.set("rozei-groups",GROUPS)) toast("保存容量がいっぱいです。古い記録を書き出して消してください"); }
function saveDev(){LS.set("rozei-dev",DEV);}
function boot(){
  const s=LS.get("rozei-setup");
  if(s){ if(s.cards&&s.cards.length) CARDS=unpackCards(s.cards);
         if(s.cfg) CFG=Object.assign(CFG,s.cfg);
         if(Array.isArray(s.schools)) SCHOOLS=s.schools; }
  const g=LS.get("rozei-groups"); if(Array.isArray(g)) GROUPS=g;
  const d=LS.get("rozei-dev"); if(d) DEV=Object.assign(DEV,d);
  render();
}
function storageUse(){
  let n=0; try{ for(const k in localStorage) if(k.indexOf("rozei")===0) n+=localStorage[k].length; }catch(e){}
  return n;
}
function mergeGroup(g){ if(!g||!g.gid) return;
  const i=GROUPS.findIndex(x=>x.gid===g.gid);
  if(i<0) GROUPS.push(g); else if((g.updated||0)>=(GROUPS[i].updated||0)) GROUPS[i]=g; }
function download(name,text){const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function readImage(file,cb){const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const s=Math.min(1,420/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",.8));};
    im.src=fr.result;};
  fr.readAsDataURL(file);}
let toastTimer=null;
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg;
  document.body.appendChild(d); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>d.remove(),2600); }

/* クラウド送信（Googleスプレッドシート等） */
async function sendCloud(list){
  if(!CFG.endpoint) return {ok:false,msg:"送信先URLが未設定です"};
  const payload=list.map(g=>Object.assign({},g,{starsTotal:sumStars(g.picks),yenTotal:sumYen(g.picks)}));
  try{
    const r=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({type:"results",groups:payload})});
    const t=await r.text();
    return {ok:r.ok,msg:r.ok?("送信しました（"+list.length+"班）"):("送信できませんでした "+t.slice(0,60))};
  }catch(e){ return {ok:false,msg:"送信できませんでした（ネット接続を確認）"}; }
}
async function fetchCloud(){
  if(!CFG.endpoint) return {ok:false,msg:"送信先URLが未設定です"};
  try{
    const q="all=1"+(CFG.readKey?"&key="+encodeURIComponent(CFG.readKey):"");
    const r=await fetch(CFG.endpoint+(CFG.endpoint.indexOf("?")<0?"?":"&")+q);
    const d=await r.json();
    if(d&&d.ok===false) return {ok:false,msg:(d.error==="key"?"取りこみキーがちがいます":"取りこめませんでした")};
    const list=(d&&d.groups)||[];
    list.forEach(mergeGroup); saveGroups();
    return {ok:true,msg:list.length+"班を取りこみました"};
  }catch(e){ return {ok:false,msg:"取りこめませんでした（URLとネット接続を確認）"}; }
}

/* 目盛りつき横棒グラフ（1グラフ＝1種類の数） */
const C_KO="#2A82B8",C_GR="#C96F15";
function chartBlock(title,sub,color,rows,unit,total){
  const max=Math.max(1,...rows.map(r=>r.v));
  const step=max<=8?1:Math.ceil(max/8);
  const axisMax=Math.ceil(max/step)*step;
  const ticks=[];for(let t=0;t<=axisMax;t+=step)ticks.push(t);
  return `<div class="chart">
    <h2><span class="sw" style="background:${color}"></span>${title}</h2>
    <p class="sub" style="margin:0 0 10px">${sub}</p>
    ${rows.map(r=>`<div class="ch-row">
      <span class="ch-lab" title="${esc(r.name)}">${r.id}. ${esc(r.name)}</span>
      <span class="ch-track" style="--tick:${100/axisMax*step}%" title="${r.id}. ${esc(r.name)}：${r.v}${unit}">
        <span class="ch-fill" style="width:${r.v/axisMax*100}%;background:${color}"></span></span>
      <span class="ch-val">${r.v}${unit}${total?` <i>${Math.round(r.v/total*100)}%</i>`:""}</span></div>`).join("")}
    <div class="ch-axisrow"><span></span>
      <span class="ch-axis">${ticks.map(t=>`<span style="left:${t/axisMax*100}%">${t}</span>`).join("")}</span>
      <span></span></div>
    <p class="sub" style="text-align:center;margin:2px 0 0">${unit==="票"?"人数（票）":"班の数"}</p></div>`;
}
/* 集計ブロック（対象グループ配列を渡す） */
function aggregate(list,label){
  const done=list.filter(g=>g.done).length;
  const people=list.reduce((a,g)=>a+g.members.length,0);
  const voted=list.reduce((a,g)=>a+g.members.filter(m=>m.cardId).length,0);
  const indiv={},grp={};
  list.forEach(g=>{g.members.forEach(m=>{if(m.cardId)indiv[m.cardId]=(indiv[m.cardId]||0)+1;});
    g.picks.forEach(id=>grp[id]=(grp[id]||0)+1);});
  const decided=list.filter(g=>g.picks.length);
  const avg=decided.length?Math.round(decided.reduce((a,g)=>a+sumYen(g.picks),0)/decided.length):0;
  const top=Object.keys(indiv).sort((a,b)=>indiv[b]-indiv[a])[0];
  return `<div class="stats">
      <div class="stat"><b>${list.length}</b><span>${label||"グループ"}</span></div>
      <div class="stat"><b>${voted}<span style="font-size:.9rem">/${people}人</span></b><span>カードを選んだ人</span></div>
      <div class="stat"><b>${done}</b><span>発表ずみ</span></div>
      <div class="stat"><b>${decided.length?man(avg):"—"}</b><span>1班あたりの平均予算</span></div></div>
    ${chartBlock("一人ひとりが選んだカード",
      `全${voted}票${top?`　一番人気は ${top}ばん ${esc(card(+top).title)}`:""}`,
      C_KO,CARDS.map(c=>({id:c.id,name:c.title,v:indiv[c.id]||0})),"票",voted)}
    ${chartBlock("グループの政策に採用されたカード",
      `全${list.length}班のうち、何班が政策に入れたか`,
      C_GR,CARDS.map(c=>({id:c.id,name:c.title,v:grp[c.id]||0})),"班",0)}`;
}
function groupRows(list,offsetKey){
  if(!list.length) return `<div class="panel center sub">まだ記録がありません。</div>`;
  return list.map(g=>{const p=progress(g);const i=GROUPS.indexOf(g);
    return `<div class="grouprow ${g.done?"fin":""}" data-action="openGroup" data-i="${i}">
      <span class="gname">${esc(g.groupName||"（無名）")}</span>
      <span class="sub">${esc(g.schoolName||"")} ${esc(g.className||"")}・${g.members.length}人</span>
      <span class="state ${p.c}">${p.t}</span>
      <span>${g.members.map(m=>`<span class="pill ${m.cardId?"":"gray"}">${m.cardId||"・"}</span>`).join(" ")}</span>
      <span style="margin-left:auto" class="sub">${g.picks.length
        ?`政策 ${g.picks.map(id=>`<span class="pill dai">${id}</span>`).join(" ")}　★${sumStars(g.picks)}／${man(sumYen(g.picks))}`
        :"政策きめ中"}</span><span class="sub">›</span></div>`;}).join("");
}

function orgAgg(){
  const f=S.filterSchool;
  const list=f?GROUPS.filter(g=>g.school===f):GROUPS;

  return `<h1>全体集計</h1>
  <div class="btn-row" style="margin:0 0 12px">
    <button class="btn ${f?"ghost":""} mini" data-action="filterSchool" data-c="">すべて（${GROUPS.length}班）</button>
    ${SCHOOLS.map(s=>`<button class="btn ${f===s.code?"":"ghost"} mini" data-action="filterSchool" data-c="${esc(s.code)}">
      ${esc(s.name)}（${(bySchool[s.code]||[]).length}）</button>`).join("")}
  </div>
  ${aggregate(list,"グループ")}
  <div class="panel"><h2>学校別のようす</h2>
    <table class="tbl"><tr><th>学校</th><th>クラス</th><th>班</th><th>人</th><th>平均予算</th><th>一番人気</th></tr>
    ${Object.keys(bySchool).map(k=>{const l=bySchool[k];
      const ind={};l.forEach(g=>g.members.forEach(m=>{if(m.cardId)ind[m.cardId]=(ind[m.cardId]||0)+1;}));
      const top=Object.keys(ind).sort((a,b)=>ind[b]-ind[a])[0];
      const dec=l.filter(g=>g.picks.length);
      const avg=dec.length?Math.round(dec.reduce((a,g)=>a+sumYen(g.picks),0)/dec.length):0;
      return `<tr class="clickable" data-action="filterSchool" data-c="${esc(k)}">
        <td><b>${esc(schoolName(k)||k)}</b></td><td>${new Set(l.map(g=>g.className)).size}</td>

        <td>${dec.length?man(avg):"—"}</td>
        <td>${top?`${top}ばん ${esc(card(+top).title)}`:"—"}</td></tr>`;}).join("")

}
app.addEventListener("input",e=>{
  const t=e.target,k=t.dataset.model;
  if(k==="reason"){G.members[G.turn].reason=t.value;return;}
  if(k==="groupReason"){G.groupReason=t.value;
    const b=app.querySelector('[data-action="go"][data-to="presenter"]');if(b)b.disabled=!t.value.trim();return;}
  if(k==="className"||k==="groupName"){G[k]=t.value;
    const b=app.querySelector('[data-action="startGame"]');if(b)b.disabled=!G.groupName.trim();return;}
  if(k==="pass"){S.pass=t.value;return;}
  if(k==="schoolcode"){S.schoolcode=t.value;return;}
  if(k==="devClass"){S.devClass=t.value;return;}
  if(k==="nsName"){S.newSchool.name=t.value;return;}
  if(k==="nsCode"){S.newSchool.code=t.value;return;}
  if(k==="nsPass"){S.newSchool.pass=t.value;return;}
  if(k==="orgPass"){CFG.orgPass=t.value.trim()||"0000";saveSetup();return;}
  if(k==="endpoint"){CFG.endpoint=t.value.trim();saveSetup();return;}
  if(k==="readKey"){CFG.readKey=t.value.trim();saveSetup();return;}
  if(t.dataset.member!==undefined){G.members[+t.dataset.member].name=t.value;return;}
  if(t.dataset.draft){const f=t.dataset.draft;
    S.draft[f]=(f==="yen"||f==="id")?(+t.value||0):t.value;
    if(f==="title"){const r=app.querySelector(".preview .ribbon");if(r)r.textContent=t.value||"タイトル";
      const sv=app.querySelector('[data-action="saveCard"]');if(sv)sv.disabled=!t.value.trim();}
    if(f==="emoji"){const d=app.querySelector(".preview .disc");if(d)d.textContent=t.value||"🃏";}}
});
app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();ACT[e.target.dataset.enter](e.target);}});
app.addEventListener("change",e=>{
  const t=e.target,fs=t.files;if(!t.dataset.file||!fs||!fs.length)return;
  if(t.dataset.file==="cardimg") readImage(fs[0],url=>{S.draft.photo=url;S.draft.img="";render();});
  if(t.dataset.file==="cards"){const fr=new FileReader();
    fr.onload=()=>{try{const d=JSON.parse(fr.result),l=Array.isArray(d)?d:d.cards;
      CARDS=unpackCards(l);if(d.cfg&&d.cfg.maxStars)CFG.maxStars=d.cfg.maxStars;saveSetup();render();
      toast("カードを読みこみました");}catch(err){alert("読みこめませんでした。");}};
    fr.readAsText(fs[0]);}
  if(t.dataset.file==="result"){let left=fs.length,n=0;
    [...fs].forEach(f=>{const fr=new FileReader();
      fr.onload=()=>{try{const d=JSON.parse(fr.result);
          const list=Array.isArray(d)?d:(d.groups||[d]);
          list.forEach(g=>{mergeGroup(g);n++;
            if(g.school&&!SCHOOLS.some(s=>s.code===g.school))
              SCHOOLS.push({code:g.school,name:g.schoolName||g.school,pass:"1234"});});
        }catch(err){alert(f.name+" は読みこめませんでした。");}
        if(--left===0){saveGroups();saveSetup();render();toast(n+"班を取りこみました");}};
      fr.readAsText(f);});}
  t.value="";
});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");
  if(b){if(b.classList.contains("modal")&&e.target.closest("[data-stop]"))return;
    const f=ACT[b.dataset.action];if(f){f(b);return;}}
  const c=e.target.closest(".card");
  if(c&&!c.disabled) onCard(+c.dataset.card);
});
function onCard(id){
  if(S.screen==="pick"){const me=G.members[G.turn];me.cardId=(me.cardId===id?null:id);commit();render();}
  else if(S.screen==="group"){const i=G.picks.indexOf(id);
    if(i>=0)G.picks.splice(i,1);else G.picks.push(id);commit();render();}
  else{S.detail=id;render();}
}
function toCsv(list){
  const h=["学校","クラス","班","人数","メンバー","個人の選択","グループの政策","星合計","予算合計","理由","発表者","状態"];
  const rows=list.map(g=>[g.schoolName||g.school||"",g.className||"",g.groupName||"",g.members.length,
    g.members.map((m,i)=>(m.name||(i+1)+"番")).join(" / "),
    g.members.map(m=>m.cardId||"-").join(" / "),
    g.picks.join(" / "),sumStars(g.picks),sumYen(g.picks),
    (g.groupReason||"").replace(/\n/g," "),g.presenter||"",progress(g).t]);
  return "﻿"+[h,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
}
function downloadCsv(name,text){const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);}

const ACT={
  /* 共通 */
  go:b=>{const to=b.dataset.to;
    if(to==="cardlist") lastStudent=S.screen;
    if(to==="presenter"||to==="groupReason") commit();
    S.screen=to;render();},
  back:()=>{S.screen=lastStudent||"home";render();},
  print:()=>window.print(),
  detail:b=>{S.detail=+b.dataset.i;render();},
  closeDetail:()=>{S.detail=null;render();},
  login:b=>{S.role=b.dataset.r;S.pass="";S.screen="login";render();},
  doLogin:()=>{
    if(S.role==="org"){
      if((S.pass||"")===CFG.orgPass){S.tab="schools";S.screen="org";render();}
      else alert("パスコードがちがいます。");
    }else{
      const s=SCHOOLS.find(x=>x.code===(S.schoolcode||"").trim());
      if(s&&(S.pass||"")===s.pass){
        DEV.school=s.code;DEV.schoolName=s.name;saveDev();
        S.devClass=DEV.className;S.tab=DEV.className?"progress":"class";S.screen="teacher";render();
      } else alert("学校コードかパスコードがちがいます。");
    }},
  logout:()=>{S.role="none";S.pass="";S.screen="home";render();},
  tab:b=>{S.tab=b.dataset.t;S.screen=(S.role==="org"?"org":"teacher");render();},

  /* 生徒 */
  addMember:()=>{G.members.push(mem(""));render();},
  delMember:b=>{G.members.splice(+b.dataset.i,1);render();},
  startGame:()=>{G.gid=G.gid||("g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    if(DEV.className){G.school=DEV.school;G.schoolName=DEV.schoolName;G.className=DEV.className;}
    G.turn=0;commit();S.screen="cover";render();},
  beginTurn:()=>{S.screen="pick";render();},
  nextTurn:()=>{commit();if(G.turn<G.members.length-1){G.turn++;S.screen="cover";}else S.screen="seno";render();},
  reveal:()=>{G.revealed=true;commit();S.screen="revealed";render();},
  clearPicks:()=>{G.picks=[];commit();render();},
  setPresenter:b=>{G.presenter=b.dataset.name;commit();render();},
  startStage:()=>{G.done=false;commit();S.screen="stage";render();},
  stageNext:()=>{G.done=true;commit();render();},
  saveResult:()=>download((G.className||"")+(G.groupName||"group")+".json",JSON.stringify(groupData(),null,2)),
  restart:()=>{commit();const names=G.members.map(m=>m.name);
    G=newGroup();G.members=names.map(mem);S.screen="start";render();},

  /* 先生 */
  saveClass:()=>{DEV.className=(S.devClass||"").trim();saveDev();
    toast("クラスを設定しました");S.tab="progress";render();},
  exportSchool:()=>{const l=GROUPS.filter(g=>g.school===DEV.school);
    download((DEV.schoolName||"school")+"-記録.json",JSON.stringify({type:"results",groups:l},null,2));
    toast(l.length+"班を書き出しました");},
  sendSchool:async()=>{const l=GROUPS.filter(g=>g.school===DEV.school);
    toast("送信中…");const r=await sendCloud(l);toast(r.msg);},
  clearSchool:()=>{if(confirm("この学校の記録をこの端末から消します。書き出しはすみましたか？")){
    GROUPS=GROUPS.filter(g=>g.school!==DEV.school);saveGroups();render();toast("消しました");}},

  /* 運営 */
  addSchool:()=>{const n=S.newSchool;
    const name=(n.name||"").trim(),code=(n.code||"").trim().toLowerCase().replace(/[^a-z0-9\-_]/g,""),
          pass=(n.pass||"").trim();
    if(!name||!code||!pass){alert("学校名・コード・パスコードをすべて入れてください。");return;}
    if(SCHOOLS.some(s=>s.code===code)){alert("そのコードはすでに使われています。");return;}
    SCHOOLS.push({code:code,name:name,pass:pass});saveSetup();
    S.newSchool={name:"",code:"",pass:""};render();toast(name+" を登録しました");},
  delSchool:b=>{const c=b.dataset.c;
    if(confirm(schoolName(c)+" を削除します。記録は残ります。よろしいですか？")){
      SCHOOLS=SCHOOLS.filter(s=>s.code!==c);saveSetup();render();}},
  viewSchool:b=>{S.filterSchool=b.dataset.c;S.tab="agg";S.screen="org";render();},
  filterSchool:b=>{S.filterSchool=b.dataset.c;render();},
  openGroup:b=>{S.openGroup=+b.dataset.i;S.screen="groupDetail";render();},
  exportAll:()=>{download("租税教室-全記録.json",JSON.stringify({type:"results",groups:GROUPS},null,2));
    toast(GROUPS.length+"班を書き出しました");},
  exportCsv:()=>{downloadCsv("租税教室-集計.csv",toCsv(GROUPS));toast("CSVを書き出しました");},
  clearGroups:()=>{if(confirm("記録をすべて消します。書き出しはすみましたか？")){
    GROUPS=[];saveGroups();render();toast("消しました");}},
  fetchCloud:async()=>{toast("取得中…");const r=await fetchCloud();toast(r.msg);render();},
  testCloud:async()=>{toast("接続中…");const r=await fetchCloud();toast(r.ok?("接続OK："+r.msg):r.msg);},
  clearDev:()=>{DEV={school:"",schoolName:"",className:""};saveDev();render();toast("端末設定を消しました");},
  setMax:b=>{CFG.maxStars=+b.dataset.n;saveSetup();render();},
  exportCards:()=>download("seisaku-cards.json",JSON.stringify({cards:packCards(),cfg:{maxStars:CFG.maxStars}},null,2)),
  resetCards:()=>{if(confirm("もとの7まいにもどします。追加したカードは消えます。")){
    CARDS=clone(DEFAULT_CARDS);saveSetup();render();}},
  newCard:()=>{S.editIndex=null;
    S.draft={id:nextId(),emoji:"🃏",img:"",photo:"",stars:1,yen:0,title:"",study:"",effect:"",ask:[],askText:""};
    S.screen="cardForm";render();},
  editCard:b=>{S.editIndex=+b.dataset.i;
    S.draft=Object.assign({emoji:"🃏",img:"",photo:"",yen:0,study:"",effect:"",ask:[]},clone(CARDS[S.editIndex]));
    S.draft.askText=(S.draft.ask||[]).join("\n");S.screen="cardForm";render();},
  setStars:b=>{S.draft.stars=+b.dataset.n;render();},
  clearImg:()=>{S.draft.img="";S.draft.photo="";render();},
  saveCard:()=>{const d=S.draft;
    const c={id:d.id||nextId(),emoji:d.emoji||"🃏",img:d.img||"",photo:d.photo||"",stars:d.stars||1,
      yen:+d.yen||0,title:d.title.trim(),study:d.study,effect:d.effect,
      ask:(d.askText||"").split("\n").map(s=>s.trim()).filter(Boolean)};
    if(CARDS.some((x,i)=>x.id===c.id&&i!==S.editIndex)){alert("その番号のカードがすでにあります。");return;}
    if(S.editIndex===null)CARDS.push(c);else CARDS[S.editIndex]=c;
    CARDS.sort((a,b2)=>a.id-b2.id);saveSetup();
    S.draft=null;S.editIndex=null;S.tab="cards";S.screen="org";render();},
  moveCard:b=>{const i=+b.dataset.i,j=i+ +b.dataset.d;if(j<0||j>=CARDS.length)return;
    const a=CARDS[i].id;CARDS[i].id=CARDS[j].id;CARDS[j].id=a;
    CARDS.sort((x,y)=>x.id-y.id);saveSetup();render();},
  delCard:b=>{const i=+b.dataset.i;
    if(confirm(`「${CARDS[i].title||"このカード"}」を消しますか？`)){CARDS.splice(i,1);saveSetup();render();}},
};
render();
boot();
</script>
